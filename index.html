<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#fde047" />
  <title>Levi's Reading Adventure</title>
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header Bar (Shown ONLY on the Overworld Map) -->
    <header id="top-header" class="top-header">
      <div class="brand-group">
        <div class="brand-logo-badge" aria-hidden="true">📖</div>
        <h1 class="brand-title">Levi's Reading Adventure</h1>
      </div>

      <div class="header-controls-group">
        <button type="button" id="btn-unlock-all" class="btn-game btn-icon" title="Unlock all levels">
          🔒
        </button>
        <button type="button" id="btn-mute" class="btn-game btn-icon" aria-label="Mute sound" title="Mute / Unmute Sound">
          🔊
        </button>
      </div>
    </header>

    <!-- SCREEN 1: Mario-Style Overworld Map -->
    <main id="screen-overworld" class="screen-overworld">
      <div id="overworld-container" class="overworld-container"></div>
    </main>

    <!-- SCREEN 2: Interactive Puzzle Scene (Zero competing text—only the sentence!) -->
    <main id="screen-scene" class="screen-scene hidden">
      <!-- Top Bar with Map Icon, Sentence Card, and Sound Icon -->
      <section class="sentence-banner-wrap" aria-label="Reading Puzzle Sentence">
        <button type="button" id="btn-back-map" class="btn-game btn-icon scene-nav-btn" aria-label="World Map" title="World Map">
          🗺️
        </button>

        <div id="sentence-card" class="sentence-card">
          <div id="sentence-text-container" class="sentence-text-container">
            Put the banana on the chair.
          </div>
        </div>

        <button type="button" id="btn-scene-mute" class="btn-game btn-icon scene-nav-btn" aria-label="Mute sound" title="Mute / Unmute Sound">
          🔊
        </button>
      </section>

      <!-- Visual Room / Scene Stage -->
      <section id="scene-stage" class="scene-stage theme-living_room">
        <!-- Upper/Middle Area: Furniture, Animals, Doors, Jars, Containers -->
        <div id="scene-targets-zone" class="scene-targets-zone"></div>

        <!-- Lower Floor Area: Draggable Fruits, Foods, Keys, Tools, Toys -->
        <div id="scene-items-zone" class="scene-items-zone"></div>

        <!-- Celebration Confetti Layer -->
        <div id="confetti-layer" class="confetti-layer"></div>

        <!-- Post-Completion Victory Modal (Stars + Level N button only) -->
        <div id="victory-overlay" class="victory-overlay hidden"></div>
      </section>
    </main>
  </div>

  <!-- Game Scripts (Cache-busted) -->
  <script src="js/audio.js?v=3"></script>
  <script src="js/sprites-items.js?v=3"></script>
  <script src="js/sprites-targets.js?v=3"></script>
  <script src="js/levels.js?v=3"></script>
  <script src="js/overworld.js?v=3"></script>
  <script src="js/game.js?v=3"></script>
</body>
</html>
